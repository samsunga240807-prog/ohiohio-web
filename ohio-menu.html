        * {

            color: #25252b;
        }

        }

        .pill {

            border-radius: 30px;
            padding: 10px 14px;
            cursor: pointer;
            backdrop-filter: blur(12px);
        }

        select {

            background: #292930;
            border: 1px solid #ffffff55;
            border-radius: 30px;
            padding: 10px;
            cursor: pointer;
        }

        select option {
            color: white;
            background: #222;
        }

        header {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            min-height: 100vh;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 110px 20px 60px;
            background: #101014;
        }

        header::before,
        header::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        header::before {
            z-index: -2;
            background: url('https://www.worldatlas.com/r/w1200/upload/8e/d2/38/shutterstock-549469321.jpg') center 55% / cover no-repeat;
            opacity: 0;
            transform: scale(1.05);
            animation: photoReveal 1.8s ease forwards;
            mask-image: linear-gradient(to bottom, transparent, #000 17%, #000 66%, transparent);
        }

        header::after {
            z-index: -1;
            background: linear-gradient(to bottom, #09090a55, #09090a66 54%, #101014);
        }

        body.light header::after {
            background: linear-gradient(to bottom, #0f111833, #0f111855 55%, #f4f3f0);
        }

            margin: 0;
            text-shadow: 0 6px 30px #0009;
        }

        header p {
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 13px;
        }

        header > div {
            animation: heroContent 1s ease both;
        }

        .cta {
            display: inline-block;
            margin-top: 24px;
            color: white;
            text-decoration: none;
            border: 1px solid #fff9;
            border-radius: 50px;
            padding: 14px 42px;
            background: #ffffff2b;
            backdrop-filter: blur(14px);
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: .3s;
        }

        .cta:hover {
            background: white;
            color: #111;
            transform: translateY(-3px);
        }

        section {
            padding: 75px 9%;
            scroll-margin-top: 75px;
        }

        h2 {
            text-align: center;
            font: 500 clamp(26px, 5vw, 38px) 'Playfair Display';
            margin: 0 0 35px;
        }

        .search-box {
            max-width: 500px;
            margin: 0 auto 25px;
        }

        .search-box input {
            width: 100%;
            padding: 15px 22px;
            border-radius: 30px;
            border: 1px solid #ffffff35;
            background: #ffffff12;
            color: inherit;
            outline: none;
            font-size: 14px;
            backdrop-filter: blur(12px);
            transition: .3s;
        }

        .search-box input:focus {
            border-color: #d8bd85;
            box-shadow: 0 0 20px #d8bd8520;
        }

        .search-box input::placeholder {
            color: #999;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 9px 20px;
            border-radius: 30px;
            border: 1px solid #ffffff35;
            background: transparent;
            color: inherit;
            cursor: pointer;
            transition: .3s;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: #f1d9a0;
            color: #181818;
            border-color: #f1d9a0;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 15px;
        }

        .card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 19px 20px;
            border-radius: 20px;
            border: 1px solid #ffffff30;
            background: linear-gradient(135deg, #ffffff1c, #ffffff08);
            backdrop-filter: blur(14px);
            box-shadow: inset 0 1px 1px #ffffff5c, 0 10px 28px #0002;
            transition: .3s;
            animation: cardAppear .5s ease both;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #f1d9a080;
            box-shadow: 0 12px 30px #0004;
        }

        body.light .card {
            background: linear-gradient(135deg, #fff, #eeedf0);
            border-color: #2222;
            box-shadow: 0 8px 24px #25252b12;
        }

        .card h3 {
            font-size: 14px;
            font-weight: 400;
            margin: 0;
        }

        .price {
            color: #f1d9a0;
            white-space: nowrap;
            font-weight: 500;
            font-size: 14px;
        }

        body.light .price {
            color: #8c5a19;
        }

        .favorite {
            position: absolute;
            top: 8px;
            right: 8px;
            border: none;
            background: transparent;
            color: #aaa;
            font-size: 17px;
            cursor: pointer;
            transition: .2s;
        }

        .favorite.active {
            color: #ff647c;
        }

        .popular {
            display: inline-block;
            font-size: 9px;
            color: #e7c987;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .empty {
            text-align: center;
            opacity: .6;
            padding: 40px 10px;
            grid-column: 1 / -1;
        }

        .foot {
            text-align: center;
            opacity: .65;
            padding: 30px;
            border-top: 1px solid #ffffff15;
        }

        @keyframes photoReveal {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes heroContent {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 700px) {

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;

            }

.favorite.pop { animation: heartPop .5s ease; }

@keyframes heartPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.8) rotate(-12deg); }
    100% { transform: scale(1); }
}

.surprise {
    background: linear-gradient(135deg, #f1d9a0, #e0a96d);

    border-color: transparent;

}

.surprise:hover { transform: rotate(-2deg) scale(1.06); }

    top: -40px;
    font-size: 28px;
    z-index: 99999;
    pointer-events: none;
    animation: fall linear forwards;
}

@keyframes fall {
    to { transform: translateY(110vh) rotate(540deg); opacity: .4; }
}

.overlay {
    position: fixed;

    z-index: 10000;
    display: none;
    place-items: center;
    background: #000a;

            'Soyutma yumurta (1 ədəd)': 'Boiled Egg (1 Piece)',
            'Qlazok yumurta (2 ədəd)': 'Sunny-Side-Up Eggs (2 Pieces)',
            'Qrenki (4 ədəd)': 'Grenki (Fried Bread, 4 Pieces)',
            'Klyarda sosiska (4 ədəd)': 'Battered Sausages (4 Pieces)',
            'Kaşa': 'Porridge',
            'Sirnik (3 ədəd)': 'Syrniki (Cottage Cheese Pancakes, 3 Pieces)',
            'Kupati (3 ədəd)': 'Kupaty (Grilled Sausages, 3 Pieces)',
            'Mimosa (şanpan, portağal)': 'Mimosa (Champagne & Orange Juice)',

            'OHIO pivə 6%-7% (0.5L)': 'OHIO Beer 6%-7% (0.5 L)',
            'OHIO pivə 8%-9% (0.5L)': 'OHIO Beer 8%-9% (0.5 L)',
            'Xırdalan (0.5L)': 'Khirdalan Beer (0.5 L)',
            'Miller (0.33L)': 'Miller Beer (0.33 L)',
            'Saçaq pendiri': 'Braided String Cheese (Sachag)',
            'Qızardılmış düşbərə': 'Fried Dushbara',
            'Qızardılmış saçaq pendir': 'Fried Braided String Cheese',

            'Quru qırmızı çaxır (butulka)': 'Dry Red Wine (Bottle)',
            'Quru qırmızı çaxır (bakal)': 'Dry Red Wine (Glass)',
            'Kam şirin qırmızı çaxır (butulka)': 'Semi-Sweet Red Wine (Bottle)',
            'Kam şirin qırmızı çaxır (bakal)': 'Semi-Sweet Red Wine (Glass)',
            'Ağ quru çaxır (butulka)': 'Dry White Wine (Bottle)',
            'Ev tut arağı (60%) (150 ml)': 'Homemade Mulberry Vodka 60% (150 ml)',
            'Ev şaftalı arağı (40%) (150 ml)': 'Homemade Peach Vodka 40% (150 ml)',
            'Zoğal arağı 70% (150 ml)': 'Cornelian Cherry Vodka 70% (150 ml)',
            'Ev likör assorti (300 ml)': 'Assorted Homemade Liqueurs (300 ml)',

            'Kofe Amerikano, 1 şirniyyat': 'Americano with a Sweet Treat (For One)',
            'Kofe Amerikano, cheesecake': 'Americano with Cheesecake (For One)',
            'Kofe Amerikano, tiramisu': 'Americano with Tiramisu (For One)',

            '2 nəfərlik çay, ev mürəbbəsi ilə': 'Tea for Two with Homemade Jam',
            '2 nəfərlik çay, ev şirniyyatı ilə': 'Tea for Two with Homemade Sweets',
            '2 nəfərlik çay, cheesecake ilə': 'Tea for Two with Cheesecake',
            '2 nəfərlik çay, tiramisu ilə': 'Tea for Two with Tiramisu',

            'Ev kompotları': 'Homemade Fruit Compote',
            'Nataxtari': 'Natakhtari (Georgian Soda)',
            'Cola, Pepsi (0.33L)': 'Cola, Pepsi (0.33 L)',
            'Təzə çəkilmiş şirələr (0.25L)': 'Freshly Squeezed Juices (0.25 L)',
            'Ev sayağı şaftalı şirəsi (1L)': 'Homemade Peach Juice (1 L)',
            'Qızıl əhmədi alma şirəsi (1L)': 'Gizil Ahmadi Apple Juice (1 L)',
            'Sirab su (0.5L)': 'Sirab Mineral Water (0.5 L)',

            'Homemade sweet': 'Homemade Sweet',
            'Tiramisu': 'Tiramisu',
            'Cheesecake': 'Cheesecake',
            'Pecan': 'Pecan Dessert',
            'Meyvə assorti (mövsümi)': 'Seasonal Fruit Platter'
        };


        const translations = {
            ru,
            en
        };


        const popular = [
            'Steak',
            'Farel tavada',
            'Sezar Toyuq',
            'Pad Thai Pasta',
            'OHIO Mix omlet',
            'Sac quzu (2 nəfərlik)'
        ];


        const catEmoji = ['🥗','🍲','🥩','🍗','🍝','🍔','🥬','🐟','🍚','🍳','🍺','🍷','☕','🫖','🥤','🍰'];
        const WA = '994555886434';

        const root = document.getElementById('content');
        const lang = document.getElementById('language');
        const search = document.getElementById('search');
        const cartFab = document.getElementById('cartFab');
        const cartOverlay = document.getElementById('cartOverlay');
        const cartModal = document.getElementById('cartModal');
        const pickOverlay = document.getElementById('pickOverlay');
        const pickModal = document.getElementById('pickModal');

        let filter = 'all';
        let lastPop = null;
        let cart = {};

        let favorites = [];
        try {
            favorites = JSON.parse(localStorage.getItem('ohio-favorites') || '[]');
        } catch (e) {}

        // имя -> цена и эмодзи
        const priceOf = {};
        const emojiOf = {};
        cats.forEach((items, i) => items.forEach(([n, p]) => {
            priceOf[n] = typeof p === 'number' ? p : parseFloat(p);
            emojiOf[n] = catEmoji[i];
        }));


        function getName(name) {
            const l = lang.value;
            if (l === 'az') return name;
            return translations[l][name] || name;
        }


        function render() {
            const l = lang.value;
            const t = words[l];
            const query = search.value.toLowerCase().trim();

            document.documentElement.lang = l;

            document.querySelectorAll('[data-t]').forEach(element => {
                element.textContent = t[element.dataset.t];
            });

            search.placeholder = t.search;

            root.innerHTML = cats.map((items, i) => {

                const cards = items.filter(([name]) => {

                    const translated = getName(name).toLowerCase();

                    const matchesSearch =
                        name.toLowerCase().includes(query) ||
                        translated.includes(query);

                    const matchesFavorites =
                        filter !== 'favorites' || favorites.includes(name);

                    const matchesPopular =
                        filter !== 'popular' || popular.includes(name);

                    return matchesSearch && matchesFavorites && matchesPopular;

                });

                if (cards.length === 0) return '';

                return `
                    <section id="${i === 2 ? 'main' : i === 10 ? 'drinks' : 'category-' + i}">

                        <h2>${catEmoji[i]} ${t.categories[i]}</h2>

                        <div class="menu">

                            ${cards.map(([name, price]) => {

                                const isPopular = popular.includes(name);
                                const isFavorite = favorites.includes(name);

                                return `
                                    <article class="card">

                                        <button
                                            class="favorite ${isFavorite ? 'active' : ''}"
                                            data-name="${name.replace(/"/g, '&quot;')}"
                                            aria-label="Favorite"
                                        >
                                            ${isFavorite ? '♥' : '♡'}
                                        </button>

                                        <div>
                                            ${isPopular ? `<span class="popular">★ ${t.popular}</span>` : ''}

                                            <h3>${getName(name)}</h3>
                                        </div>

                                        <div class="price-box">
                                            <span class="price">
                                                ${typeof price === 'number' ? price.toFixed(2) : price} ₼
                                            </span>
                                            <button class="add" data-name="${name.replace(/"/g, '&quot;')}" aria-label="Add">+</button>
                                        </div>

                                    </article>
                                `;

                            }).join('')}

                        </div>

                    </section>
                `;

            }).join('');


            if (!root.innerHTML) {
                root.innerHTML = `
                    <div class="empty">
                        ${filter === 'favorites' && !query ? t.empty : t.noResults}
                    </div>
                `;
            }

            if (lastPop) {
                root.querySelectorAll('.favorite').forEach(b => {
                    if (b.dataset.name === lastPop) b.classList.add('pop');
                });
                lastPop = null;
            }

            updateCart();
        }


        // клики по сердечку и плюсу (делегирование)
        root.addEventListener('click', e => {

            const fav = e.target.closest('.favorite');
            const add = e.target.closest('.add');

            if (fav) {
                const name = fav.dataset.name;

                if (favorites.includes(name)) {
                    favorites = favorites.filter(item => item !== name);
                } else {
                    favorites.push(name);
                    lastPop = name;
                }

                try {
                    localStorage.setItem('ohio-favorites', JSON.stringify(favorites));
                } catch (err) {}

                render();
            }

            if (add) {
                addToCart(add.dataset.name);
            }
        });


        // ===== КОРЗИНА =====
        function addToCart(name) {
            cart[name] = (cart[name] || 0) + 1;
            updateCart();
            cartFab.classList.remove('bump');
            void cartFab.offsetWidth;
            cartFab.classList.add('bump');
        }

        function cartTotals() {
            let count = 0, total = 0;
            Object.entries(cart).forEach(([n, q]) => {
                count += q;
                total += q * (priceOf[n] || 0);
            });
            return { count, total };
        }

        function updateCart() {
            const t = words[lang.value];
            const { count, total } = cartTotals();

            cartFab.classList.toggle('show', count > 0);
            cartFab.textContent = `🛒 ${count} · ${total.toFixed(2)} ₼`;

            if (count === 0) {
                cartOverlay.classList.remove('show');
                return;
            }

            cartModal.innerHTML = `
                <div class="big">🧾</div>
                <h4>${t.order}</h4>
                <div class="cart-list">
                    ${Object.entries(cart).map(([n, q]) => `
                        <div class="cart-item">
                            <span>${emojiOf[n]} ${getName(n)}</span>
                            <span class="qty">
                                <button data-act="minus" data-name="${n.replace(/"/g, '&quot;')}">−</button>
                                ${q}
                                <button data-act="plus" data-name="${n.replace(/"/g, '&quot;')}">+</button>
                            </span>
                        </div>
                    `).join('')}
                </div>
                <div class="cart-total">${t.total}: <b>${total.toFixed(2)} ₼</b></div>
                <div class="row">
                    <button class="btn wa" data-act="send">${t.send}</button>
                    <button class="btn ghost" data-act="clear">${t.clear}</button>
                    <button class="btn ghost" data-act="close">${t.close}</button>
                </div>
            `;
        }

        cartFab.addEventListener('click', () => cartOverlay.classList.add('show'));

        cartOverlay.addEventListener('click', e => {
            if (e.target === cartOverlay) cartOverlay.classList.remove('show');

            const b = e.target.closest('button[data-act]');
            if (!b) return;

            const act = b.dataset.act;
            const name = b.dataset.name;

            if (act === 'plus') cart[name]++;
            if (act === 'minus') {
                cart[name]--;
                if (cart[name] <= 0) delete cart[name];
            }
            if (act === 'clear') cart = {};
            if (act === 'close') cartOverlay.classList.remove('show');

            if (act === 'send') {
                const t = words[lang.value];
                const { total } = cartTotals();
                const lines = Object.entries(cart).map(([n, q]) =>
                    `• ${q}× ${getName(n)} — ${(q * (priceOf[n] || 0)).toFixed(2)} ₼`
                );
                const text = `${t.greeting}\n${lines.join('\n')}\n\n${t.total}: ${total.toFixed(2)} ₼`;
                window.open(`https://wa.me/${WA}?text=${encodeURIComponent(text)}`, '_blank');
                return;
            }

            updateCart();
        });


        // ===== УДИВИ МЕНЯ =====
        function pickRandom() {
            const t = words[lang.value];
            const all = cats.flat();
            const [name, price] = all[Math.floor(Math.random() * all.length)];

            pickModal.innerHTML = `
                <div class="big">${emojiOf[name]}</div>
                <div style="opacity:.7;font-size:13px">${t.yourPick}</div>
                <h4>${getName(name)}</h4>
                <div class="mprice">${typeof price === 'number' ? price.toFixed(2) : price} ₼</div>
                <div class="row">
                    <button class="btn" id="pickAdd">${t.addOrder}</button>
                    <button class="btn ghost" id="pickAgain">${t.again}</button>
                    <button class="btn ghost" id="pickClose">${t.close}</button>
                </div>
            `;

            pickOverlay.classList.add('show');
            rain([emojiOf[name]], 14);

            document.getElementById('pickAdd').onclick = () => {
                addToCart(name);
                pickOverlay.classList.remove('show');
            };
            document.getElementById('pickAgain').onclick = pickRandom;
            document.getElementById('pickClose').onclick = () => pickOverlay.classList.remove('show');
        }

        document.getElementById('surprise').addEventListener('click', pickRandom);

        pickOverlay.addEventListener('click', e => {
            if (e.target === pickOverlay) pickOverlay.classList.remove('show');
        });


        // ===== ДОЖДЬ ИЗ ЕДЫ (клик по логотипу) =====
        function rain(list, n) {
            for (let i = 0; i < n; i++) {
                const s = document.createElement('span');
                s.className = 'fall';
                s.textContent = list[Math.floor(Math.random() * list.length)];
                s.style.left = Math.random() * 100 + 'vw';
                s.style.animationDuration = (2 + Math.random() * 2.5) + 's';
                s.style.fontSize = (22 + Math.random() * 22) + 'px';
                document.body.appendChild(s);
                setTimeout(() => s.remove(), 5000);
            }
        }

        document.getElementById('logo').addEventListener('click', () => {
            rain(['🍔','🍕','🍷','🍺','🥩','🍰','🧀','🍗','🥗','☕','🐟'], 30);
        });


        // ===== ЯЗЫК, ТЕМА, ФИЛЬТРЫ =====
        lang.value = localStorage.getItem('ohio-language') || 'ru';

        if (!words[lang.value]) {
            lang.value = 'ru';
        }

        lang.addEventListener('change', () => {

            localStorage.setItem('ohio-language', lang.value);

            updateTheme();
            render();

        });


        search.addEventListener('input', render);


        document.querySelectorAll('.filter-btn[data-filter]').forEach(button => {

            button.addEventListener('click', () => {

                filter = button.dataset.filter;

                document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
                    btn.classList.remove('active');
                });

                button.classList.add('active');

                render();

            });

        });


        function updateTheme() {

            const light = document.body.classList.contains('light');

            document.getElementById('theme').textContent =
                words[lang.value].toggle + ': ' + (light ? '☼' : '☾');

        }


        function setTheme(light) {

            document.body.classList.toggle('light', light);

            localStorage.setItem(
                'ohio-theme',
                light ? 'light' : 'dark'
            );

            updateTheme();

        }


        setTheme(localStorage.getItem('ohio-theme') === 'light');

        document.getElementById('theme').addEventListener('click', () => {

            setTheme(!document.body.classList.contains('light'));

        });


        render();

    </script>

</body>
</html>
